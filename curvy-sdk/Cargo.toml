[package]
name = "curvy-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# L5 — the thin CurvyClient facade for the e2e: accounts (keccak-KDF login), note
# build/send via curvy-core stealth, and the shield→commit→aggregate→scan
# orchestration over the L2 trait objects + curvy-abi calldata/signing +
# curvy-witnesscalc proving. Minimal in-memory storage. NO direct alloy/blokli/reqwest
# dependency — the seam is real, reached only through the adapter crates.

[dependencies]
curvy-core = { workspace = true }
curvy-witnesscalc = { path = "../curvy-witnesscalc" }
curvy-chain-api = { path = "../curvy-chain-api" }
curvy-abi = { path = "../curvy-abi" }
curvy-types = { path = "../curvy-types" }
ark-bn254 = { workspace = true }
ark-ff = { workspace = true }
num-bigint = { workspace = true }
sha3 = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
hex = { workspace = true }
