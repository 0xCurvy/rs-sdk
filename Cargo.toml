[workspace]
resolver = "2"
members = [
    "curvy-types",
    "curvy-chain-api",
    "curvy-abi",
    "curvy-witnesscalc",
    "curvy-chain-blokli",
    "curvy-chain-rpc",
    "curvy-sdk",
    "curvy-e2e",
]

[workspace.package]
version = "0.1.0-rc.6"
edition = "2024"
license = "MIT"
repository = "https://github.com/0xCurvy/rs-sdk"
rust-version = "1.94"

[workspace.dependencies]
# The workspace's own crates, versioned so they can be published. Published in this
# order: types, chain-api, abi, witnesscalc, chain-blokli, sdk.
curvy-types = { path = "curvy-types", version = "=0.1.0-rc.6" }
curvy-chain-api = { path = "curvy-chain-api", version = "=0.1.0-rc.6" }
curvy-abi = { path = "curvy-abi", version = "=0.1.0-rc.6" }
curvy-witnesscalc = { path = "curvy-witnesscalc", version = "=0.1.0-rc.6" }
curvy-chain-blokli = { path = "curvy-chain-blokli", version = "=0.1.0-rc.6" }
curvy-chain-rpc = { path = "curvy-chain-rpc", version = "=0.1.0-rc.6" }
curvy-sdk = { path = "curvy-sdk", version = "=0.1.0-rc.6" }

# Exact versions keep artifact evaluation reproducible: the graph and zkey digests
# pinned in curvy-witnesscalc are only known to hold for these releases. `parallel` is
# opt-in since rc.6 (rc.3 had it on by default); without it proving is single-threaded.
curvy-core = "=0.1.0-rc.6"
curvy-prover = { version = "=0.1.0-rc.6", features = ["parallel"] }
curvy-witness = "=0.1.0-rc.6"

# Field values cross the crate boundary.
ark-bn254 = { version = "=0.6.0", features = ["std"] }
ark-ff = { version = "=0.6.0", features = ["std"] }

# EVM adapters use HTTP without TLS or WebSocket support.
alloy = { version = "1", default-features = false, features = [
    "consensus",
    "contract",
    "eips",
    "json",
    "network",
    "providers",
    "reqwest",
    "rpc-types",
    "signer-local",
    "sol-types",
    "std",
] }
# GraphQL/HTTP to bloklid :8080.
reqwest = { version = "0.13", default-features = false, features = ["json"] }

tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
hex = "0.4"
num-bigint = "=0.5.1"
sha3 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
