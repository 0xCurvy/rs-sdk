[workspace]
resolver = "2"
members = [
    "curvy-types",
    "curvy-chain-api",
    "curvy-abi",
    "curvy-witnesscalc",
    "curvy-chain-blokli",
    "curvy-chain-rpc",
    "curvy-sdk",
    "curvy-e2e",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.94"

[workspace.dependencies]
# Exact versions keep artifact evaluation reproducible.
curvy-core = "=0.1.0-rc.3"
curvy-prover = "=0.1.0-rc.3"
curvy-witness = "=0.1.0-rc.3"

# Field values cross the crate boundary.
ark-bn254 = { version = "=0.6.0", features = ["std"] }
ark-ff = { version = "=0.6.0", features = ["std"] }

# EVM adapters use HTTP without TLS or WebSocket support.
alloy = { version = "1", default-features = false, features = [
    "consensus",
    "contract",
    "eips",
    "json",
    "network",
    "providers",
    "reqwest",
    "rpc-types",
    "signer-local",
    "sol-types",
    "std",
] }
# GraphQL/HTTP to bloklid :8080.
reqwest = { version = "0.13", default-features = false, features = ["json"] }

tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
hex = "0.4"
num-bigint = "=0.5.1"
sha3 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
