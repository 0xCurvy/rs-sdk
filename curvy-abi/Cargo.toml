[package]
name = "curvy-abi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# L3 - alloy `sol!` bindings for the deployed Curvy contracts (generated at compile
# time from the ABI JSONs VENDORED under abi/, so the circuits repo is not read at runtime),
# plus the calldata encoders, local raw-tx signer, snarkjs→on-chain proof transform
# (the G2 coordinate swap), and event decoders. This is the only crate the SDK uses
# to touch EVM calldata; it exposes NEUTRAL types (curvy-types) so curvy-sdk stays
# free of any direct alloy dependency.

[dependencies]
curvy-types = { path = "../curvy-types" }
alloy = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
hex = { workspace = true }
