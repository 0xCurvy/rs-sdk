[package]
name = "curvy-witnesscalc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Witness-calculator seam. One
# `WitnessCalculator` trait + a graph-based pure-Rust impl (Curvy's own `curvy-witness`
# CVYWIT01 evaluator); per-circuit graph/zkey artifacts pinned by sha256; the interim
# `build_pending_commitment` input massaging (documented as the stopgap for the core
# `to_circuit_input()` fix).
# Depends on curvy-prover for the Groth16 leg — one crate turns (input JSON) → (proof).

[dependencies]
curvy-core = { workspace = true }
curvy-prover = { workspace = true }
curvy-witness = { workspace = true }
ark-bn254 = { workspace = true }
ark-ff = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
sha2 = "0.10"
hex = { workspace = true }
anyhow = { workspace = true }
num-bigint = { workspace = true }

# Test-only. The equivalence gate in `tests/pix_profiles.rs` runs both evaluators over
# the same input and compares every signal; that is the evidence the CVYWIT graphs are
# faithful. It stays out of `[dependencies]` because it needs `bindgen`/`clang`, which
# the SDK's Nix and bare-Linux targets do not have.
#
# `sage` and `signet` are likewise dev-only: they put SAGE and the version-2 encoding on
# the same real artifacts as the shipped one without enabling it for `cargo build`.
[dev-dependencies]
circom-witnesscalc = "0.3.0"
curvy-witness = { workspace = true, features = ["sage", "signet"] }
